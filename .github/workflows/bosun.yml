name: bosun

# Written by the bosun splice channel (owned: `splice update --channel bosun` replaces it, so a
# local edit is drift). Every gate runs `bosun gate <name>`; change a gate's command in
# .bosun/profiles/<profile>.toml. The repo's own ci.yml, if any, is never touched.
#
# CI minutes (docs/ci-minutes.md in keelstackhq/bosun): a private repo pays for every job, each
# rounded up to a whole minute, so a rust stack runs everything in ONE job that carries the
# required check's name. A ts-pnpm (or mixed) stack runs two: bosun-trusted runs the gates that
# run no PR code, and the required check's job installs and runs the PR's code only after that
# passed (see bosun-trusted). A draft fails at once (ready_for_review runs the gates), and after a
# PR body or title edit only test-integrity (which reads the body) runs again on a head that
# passed. Run the same gates locally first: AGENTS.md has the one command.
on:
  pull_request:
    branches: [main]
    # `edited` covers a stacked PR being retargeted to main and a new `snapshot-change:` line.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
  # main-health runs the same gates weekly on all of main.
  workflow_call:

# One group per PR. A push (or a retarget) cancels the older run of the PR. A body or title edit
# never cancels: it waits for the running run, then keeps that run's file gates when it passed
# and runs test-integrity on its own body (else every gate). So an edit never leaves a cancelled
# run and a red aggregate check behind.
concurrency:
  group: bosun-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && !github.event.changes.base) }}

# checks: read lets a body edit read the head's earlier result.
permissions:
  contents: read
  checks: read
  # step `task allow list` reads the PR body and its linked task.
  issues: read
  pull-requests: read

# A PR's .cargo/config.toml must not swap the compiler cargo runs (a rustc wrapper or
# build.rustc would run PR code in rust-cache and the gates before lint): cargo takes these over
# its config files. The rust toolchain step refuses a toolchain file that names a path.
env:
  RUSTC: rustc
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""

jobs:
  # ts-pnpm (and mixed) stacks: two jobs, so that no PR code (install scripts, a pnpmfile,
  # patches, dependency names, workspace settings, cargo or npm config) runs before or beside the
  # gates that must not trust it. This job runs test-integrity and deps: it never installs the
  # PR's dependencies and restores no cache, and pnpm runs here only for the deps gate's audit,
  # which reads the PR's pnpm-lock.yaml as data while every pnpm config file is the base's. The
  # required check's job below runs fmt, lint and test (PR code) only after this job passed.
  # Read-only token, no secrets (both jobs).
  bosun-trusted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Defence in depth: the pnpmfile here is the base's, and no pnpm call loads it; pnpm never
      # switches to another release (packageManager, devEngines). Both env spellings (pnpm 11
      # reads pnpm_config_*).
      npm_config_ignore_pnpmfile: "true"
      pnpm_config_ignore_pnpmfile: "true"
      npm_config_manage_package_manager_versions: "false"
      pnpm_config_manage_package_manager_versions: "false"
    outputs:
      version: ${{ steps.pin.outputs.version }}
      sha256: ${{ steps.bin.outputs.sha256 }}
      # The gates the required check's job runs; empty: none (an edit, docs only, own_ci).
      pr_gates: ${{ steps.gates.outputs.pr_gates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Docs-only fast path (pull requests only): when every changed file is a *.md under docs/ or
      # plans/ or at the root (not README.md), no gate runs and the check passes. Not for the
      # ts-pnpm stack: its fmt gate (prettier) checks Markdown too, so docs_only is always false.
      # Any other event, an empty diff or a diff that cannot be computed gives docs_only=false
      # (fail closed). risk.yml and verdict.yml are separate workflows and still judge such a PR.
      - id: diff
        run: echo "docs_only=false" >> "$GITHUB_OUTPUT"

      # A body or title edit that did not retarget the PR changes no file, so the gates that read
      # only files keep the result of the head's newest finished run of this check (GitHub
      # Actions, not this run). test-integrity also reads the PR body, and that run may have read
      # another body (an edit can replace a pending run), so after a success it runs again on the
      # body of this event (mode=integrity). After anything else, or none, every gate runs.
      - if: github.event.action == 'edited' && !github.event.changes.base
        id: edit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CHECK: bosun-ok
        run: |
          mode=run
          prev="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs?check_name=$CHECK&filter=all&per_page=100" \
            --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and .status == \"completed\" and (.details_url | contains(\"/runs/$GITHUB_RUN_ID/\") | not))] | max_by(.id) | .conclusion // \"\"" || true)"
          if [ "$prev" = success ]; then mode=integrity; fi
          echo "the head's earlier $CHECK: ${prev:-none}; mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      # work: run the pinned bosun and gates; setup: install the stack's tools; only: the gates.
      - id: plan
        env:
          DRAFT: ${{ github.event.pull_request.draft || false }}
          DOCS_ONLY: ${{ steps.diff.outputs.docs_only }}
          MODE: ${{ steps.edit.outputs.mode || 'run' }}
        run: |
          if [ "$DRAFT" = true ]; then echo "::error::draft: not checked; mark it ready to run the gates"; exit 1; fi
          if [ "$DOCS_ONLY" = true ]; then
            echo "work=false" >> "$GITHUB_OUTPUT"; echo "docs only: no gate runs"
          elif [ "$MODE" = integrity ]; then
            { echo "work=true"; echo "setup=false"; echo "only=test-integrity"; } >> "$GITHUB_OUTPUT"
            echo "this head passed the file gates; test-integrity runs on this body"
          else
            { echo "work=true"; echo "setup=true"; } >> "$GITHUB_OUTPUT"
          fi
      # The gates run the bosun release pinned in the base commit's .bosun/version, so a change to
      # the pin takes effect only after it merges. (A change to this file runs at once: R-ci.)
      - if: steps.plan.outputs.work == 'true'
        name: pinned release of the base
        id: pin
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          v=""
          if [ -n "$BASE" ]; then v="$(git show "$BASE:.bosun/version" 2>/dev/null | tr -d '[:space:]' || true)"; fi
          if [ -z "$v" ]; then
            # No base (weekly run), or a base with no bosun yet (the setup PR): this commit's pin.
            v="$(tr -d '[:space:]' < .bosun/version)"
            if [ "$EVENT" = pull_request ]; then
              echo "::warning::the base pins no bosun release yet; using this change's pin $v (setup PR)"
            fi
          fi
          # An exact x.y.z only: never a dist-tag, range, URL or path.
          printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::.bosun/version must be an exact x.y.z, not '$v'"
            exit 1
          }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.work == 'true'
        name: install the pinned release
        id: bin
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          npm install -g --ignore-scripts "@keelstackhq/bosun@${VERSION}"
          dir="$(cd "$(npm root -g)/@keelstackhq/bosun" && node -p "require('path').dirname(require.resolve('@keelstackhq/bosun-linux-x64/package.json'))")"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$dir/bin/bosun" "$RUNNER_TEMP/bin/bosun"
          got="$("$RUNNER_TEMP/bin/bosun" --version)"
          echo "$got"
          test "$got" = "bosun ${VERSION}"
          # The gates check the binary against this hash before each gate.
          echo "sha256=$(sha256sum "$RUNNER_TEMP/bin/bosun" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The pin a change sets must be a published release that reports its own version.
      - if: steps.plan.outputs.work == 'true'
        name: the pinned release installs and reports its version
        env:
          BASE_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          v="$(tr -d '[:space:]' < .bosun/version)"
          printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::.bosun/version must be an exact x.y.z, not '$v'"
            exit 1
          }
          if [ "$v" = "$BASE_VERSION" ]; then echo "same pin as the base: installed above"; exit 0; fi
          npm install -g --ignore-scripts "@keelstackhq/bosun@${v}"
          got="$(bosun --version)"
          echo "$got"
          test "$got" = "bosun ${v}"
      # Before anything runs rustc, cargo or the stack's tools (rust-cache included).
      - if: steps.plan.outputs.work == 'true'
        name: the base's config for the gates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$GITHUB_SHA";; esac
          # The gates use the base commit's copies of the files that decide what runs: .bosun/ (the gate
          # commands are in its profiles), every .cargo directory (aliases, includes, rustc wrappers)
          # every rust-toolchain(.toml) (a path would run a compiler from the PR), every .npmrc
          # (node-options would load PR code into each pnpm call), every .pnpmfile and every
          # deny.toml (cargo deny's policy). Files the base
          # lacks are deleted, also when the PR made the path a symlink. A PR's changes to them take
          # effect after it merges; they are R-gov or R-ci, so the owner sees them.
          pat='(^|/)\.cargo(/|$)|(^|/)rust-toolchain(\.toml)?$|(^|/)\.npmrc$|(^|/)\.pnpmfile\.[cm]?js$|(^|/)\.?deny(\.exceptions)?\.toml$|^\.bosun(/|$)'
          if ! git cat-file -e "$BASE:.bosun/version" 2>/dev/null; then
            echo "::warning::the base has no .bosun yet (setup PR): this change's .bosun is used"
            pat='(^|/)\.cargo(/|$)|(^|/)rust-toolchain(\.toml)?$|(^|/)\.npmrc$|(^|/)\.pnpmfile\.[cm]?js$|(^|/)\.?deny(\.exceptions)?\.toml$'
          fi
          changed="$(git diff --name-only -z "$BASE" HEAD | { grep -zE "$pat" || true; } | tr '\0' ' ')"
          if [ -n "$changed" ]; then
            echo "::notice::this change edits ${changed}; its gates run with the base's copies (they apply after merge)"
          fi
          git ls-tree -r -z --name-only HEAD | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
            rm -rf -- "$p"
          done
          git ls-tree -r -z --name-only "$BASE" | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
            mkdir -p -- "$(dirname -- "$p")"
            git show "$BASE:$p" > "$p"
          done
      # ts-pnpm stack, for the deps gate's `pnpm audit` only: Node 24 and the pnpm release that the
      # base's package.json `packageManager` names (the PR's while the base names none), an exact
      # version 9 or later from the registry, never a path, URL or range. No install, no cache. Skipped
      # while the stack has no lockfile yet (a new repo).
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.work == 'true' && steps.plan.outputs.setup == 'true' && hashFiles('./pnpm-lock.yaml') != ''
        with:
          node-version: 24
      - if: steps.plan.outputs.work == 'true' && steps.plan.outputs.setup == 'true' && hashFiles('./pnpm-lock.yaml') != ''
        name: pnpm for the audit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$GITHUB_SHA";; esac
          pm() { python3 -I -c 'import json, sys; d = json.load(sys.stdin); v = d.get("packageManager", "") if isinstance(d, dict) else ""; print(v if isinstance(v, str) else "!")'; }
          v="$(git show "$BASE:./package.json" 2>/dev/null | pm || true)"
          if [ -z "$v" ]; then v="$(pm < "./package.json" || true)"; fi
          # pnpm@x.y.z (9 or later: older releases read other config files), with an optional
          # +sha hash (the registry checks the tarball).
          v="${v%%+*}"
          [[ "$v" =~ ^pnpm@(9|[1-9][0-9]+)\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::./package.json: packageManager must name pnpm@x.y.z (9 or later), not '$v'"
            exit 1
          }
          cd "$RUNNER_TEMP"
          npm install -g --ignore-scripts "$v"
          # pnpm 12 ships a native binary that its install.js puts in place.
          if [ -f "$(npm root -g)/pnpm/install.js" ]; then (cd "$(npm root -g)/pnpm" && node install.js); fi
          got="$(pnpm --version)"
          echo "pnpm $got"
          test "pnpm@$got" = "$v"
      # The kinds test-integrity may allow come from the PR's linked task (the plan's `allow:`),
      # read with this run's read-only token before any PR code runs, and never in the gates
      # step, where lint and test run PR code. Only known kinds pass; any failure (a pinned
      # bosun without `--pr`, an API error) allows nothing.
      - if: steps.plan.outputs.work == 'true' && github.event_name == 'pull_request'
        id: allow
        name: task allow list
        env:
          BOSUN_SHA256: ${{ steps.bin.outputs.sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bosun="$RUNNER_TEMP/bin/bosun"
          echo "$BOSUN_SHA256  $bosun" | sha256sum -c --quiet || { echo "::error::$bosun changed"; exit 1; }
          kinds="$("$bosun" test-integrity --pr "$PR" 2>/dev/null \
            | jq -r '[.data.allow // [] | .[] | select(IN("delete-test","skip","only","fewer-asserts"))] | join(",")' 2>/dev/null)" || kinds=""
          echo "test-integrity allows: ${kinds:-nothing}"
          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
      # The gates run in order and stop at the first failure: here test-integrity and deps, which
      # run no PR code; the step's output names the rest for the required check's job.
      - if: steps.plan.outputs.work == 'true'
        name: bosun gates
        id: gates
        env:
          # The repo's own ci.yml already runs fmt, lint, test and deps; only test-integrity is
          # unique to bosun. So a pull request runs just that and relies on the repo's own ci-ok
          # for the rest; if that CI lacks one (cargo-deny, say), set the repo variable
          # BOSUN_ALL_GATES to '1' to run all five on pull requests too. Every other event (push
          # to main, merge queue, the weekly run main-health calls, where github.event_name is
          # the caller's, e.g. schedule) runs all five gates.
          GATES: ${{ (vars.BOSUN_ALL_GATES == '1' || github.event_name != 'pull_request') && 'test-integrity deps fmt lint test' || 'test-integrity' }}
          # An edit after a success runs test-integrity only (see the edit step).
          ONLY: ${{ steps.plan.outputs.only }}
          BOSUN_SHA256: ${{ steps.bin.outputs.sha256 }}
          # The linked task's allowed kinds (step `task allow list`); empty off a pull request.
          BOSUN_INTEGRITY_ALLOW: ${{ steps.allow.outputs.kinds }}
          # test-integrity reads the snapshot-change line from the PR body.
          BOSUN_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          bosun="$RUNNER_TEMP/bin/bosun"
          GATES="${ONLY:-$GATES}"
          # A PR runs each gate on what it changed; main and the queue run it on everything.
          if [ "$EVENT" = "pull_request" ]; then all=""; else all="--all"; fi
          # Here only the gates that run no PR code; the required check's job runs the rest.
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$GITHUB_SHA";; esac
          later=""
          for g in $GATES; do
            case "$g" in test-integrity|deps) ;; *) later="$later $g"; continue ;; esac
            # test-integrity has read the PR's manifests. From here pnpm reads only the base's
            # config: `pnpm audit` reads the PR's pnpm-lock.yaml as data, and every package.json
            # and pnpm-workspace.yaml (where a PR could name a pnpmfile, config dependencies or
            # any pnpm setting) is the base's; one the base lacks is deleted, and a stack root
            # package.json the base lacks (a PR that adds the stack) is {}. No file is written
            # through a directory link that leaves the checkout. Also when the PR has no
            # lockfile: what pnpm reads never depends on the PR. So a PR's change to these
            # (auditConfig too) applies after it merges.
            if [ "$g" = deps ]; then
              pat='(^|/)package\.json$|(^|/)pnpm-workspace\.ya?ml$'
              changed="$(git diff --name-only -z "$BASE" HEAD | { grep -zE "$pat" || true; } | tr '\0' ' ')"
              if [ -n "$changed" ]; then
                echo "::notice::this change edits ${changed}; deps (pnpm audit) uses the base's copies (they apply after merge)"
              fi
              git ls-tree -r -z --name-only HEAD | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
                rm -rf -- "$p"
              done
              top="$(pwd -P)"
              git ls-tree -r -z --name-only "$BASE" | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
                case "$(realpath -m -- "$(dirname -- "$p")")" in
                  "$top"|"$top"/*) ;;
                  *) echo "::error::$p: its directory links outside the checkout"; exit 1 ;;
                esac
                mkdir -p -- "$(dirname -- "$p")"
                git show "$BASE:$p" > "$p"
              done
              # Only for a stack directory in the checkout (a new repo may have none yet).
              if [ -d "." ] && [ ! -e "./package.json" ]; then
                case "$(realpath -m -- ".")" in
                  "$top"|"$top"/*) echo '{}' > "./package.json" ;;
                esac
              fi
            fi
            echo "::group::bosun gate $g"
            # Defence in depth: the pinned bosun, unchanged since step bin.
            echo "$BOSUN_SHA256  $bosun" | sha256sum -c --quiet || { echo "::error::$bosun changed"; exit 1; }
            "$bosun" gate "$g" $all || { echo "::error::gate $g failed; later gates did not run"; exit 1; }
            echo "::endgroup::"
          done
          echo "pr_gates=${later# }" >> "$GITHUB_OUTPUT"

  # The required CI check (spec D15). Beside a repo's own ci.yml and its ci-ok, it is called
  # bosun-ok. It needs bosun-trusted and fails at once unless that passed (a draft, a failed
  # gate, a cancel, a timeout): never skipped, since a skipped required check counts as passed.
  # Then it installs the PR's dependencies and runs the gates that run PR code (fmt, lint,
  # test). Nothing it does reaches bosun-trusted, which finished first and restores no cache
  # this job saves.
  bosun-ok:
    needs: bosun-trusted
    # always(), not !cancelled(): a cancelled run would skip this job, and a skipped required
    # check counts as passed. The first step fails unless bosun-trusted succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # always(): after a cancel a step without `if` would be skipped, not fail.
      - if: always()
        name: bosun-trusted passed
        env:
          RESULT: ${{ needs.bosun-trusted.result }}
          PR_GATES: ${{ needs.bosun-trusted.outputs.pr_gates }}
        run: |
          echo "bosun-trusted: $RESULT; gates here: ${PR_GATES:-none}"
          test "$RESULT" = success
      - if: needs.bosun-trusted.outputs.pr_gates != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The same pinned release as bosun-trusted, checked against its hash.
      - if: needs.bosun-trusted.outputs.pr_gates != ''
        name: install the pinned release
        env:
          VERSION: ${{ needs.bosun-trusted.outputs.version }}
          SHA256: ${{ needs.bosun-trusted.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP"
          npm install -g --ignore-scripts "@keelstackhq/bosun@${VERSION}"
          dir="$(cd "$(npm root -g)/@keelstackhq/bosun" && node -p "require('path').dirname(require.resolve('@keelstackhq/bosun-linux-x64/package.json'))")"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$dir/bin/bosun" "$RUNNER_TEMP/bin/bosun"
          echo "$SHA256  $RUNNER_TEMP/bin/bosun" | sha256sum -c --quiet
      # The gate commands are the base's .bosun/ profiles, as in bosun-trusted (the same step).
      - if: needs.bosun-trusted.outputs.pr_gates != ''
        name: the base's config for the gates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="$GITHUB_SHA";; esac
          # The gates use the base commit's copies of the files that decide what runs: .bosun/ (the gate
          # commands are in its profiles), every .cargo directory (aliases, includes, rustc wrappers)
          # every rust-toolchain(.toml) (a path would run a compiler from the PR), every .npmrc
          # (node-options would load PR code into each pnpm call), every .pnpmfile and every
          # deny.toml (cargo deny's policy). Files the base
          # lacks are deleted, also when the PR made the path a symlink. A PR's changes to them take
          # effect after it merges; they are R-gov or R-ci, so the owner sees them.
          pat='(^|/)\.cargo(/|$)|(^|/)rust-toolchain(\.toml)?$|(^|/)\.npmrc$|(^|/)\.pnpmfile\.[cm]?js$|(^|/)\.?deny(\.exceptions)?\.toml$|^\.bosun(/|$)'
          if ! git cat-file -e "$BASE:.bosun/version" 2>/dev/null; then
            echo "::warning::the base has no .bosun yet (setup PR): this change's .bosun is used"
            pat='(^|/)\.cargo(/|$)|(^|/)rust-toolchain(\.toml)?$|(^|/)\.npmrc$|(^|/)\.pnpmfile\.[cm]?js$|(^|/)\.?deny(\.exceptions)?\.toml$'
          fi
          changed="$(git diff --name-only -z "$BASE" HEAD | { grep -zE "$pat" || true; } | tr '\0' ' ')"
          if [ -n "$changed" ]; then
            echo "::notice::this change edits ${changed}; its gates run with the base's copies (they apply after merge)"
          fi
          git ls-tree -r -z --name-only HEAD | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
            rm -rf -- "$p"
          done
          git ls-tree -r -z --name-only "$BASE" | { grep -zE "$pat" || true; } | while IFS= read -r -d '' p; do
            mkdir -p -- "$(dirname -- "$p")"
            git show "$BASE:$p" > "$p"
          done
      # Node 24, pnpm from package.json `packageManager`, the Turborepo cache through hoard. A
      # plain install: the PR's install scripts run here, after bosun-trusted passed.
      - uses: pnpm/action-setup@v4
        if: needs.bosun-trusted.outputs.pr_gates != '' && hashFiles('./pnpm-lock.yaml') != ''
        with:
          package_json_file: ./package.json
      - uses: actions/setup-node@v4
        if: needs.bosun-trusted.outputs.pr_gates != '' && hashFiles('./pnpm-lock.yaml') != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - if: needs.bosun-trusted.outputs.pr_gates != '' && hashFiles('./pnpm-lock.yaml') != ''
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: keelstackhq/hoard@v0
        if: needs.bosun-trusted.outputs.pr_gates != '' && hashFiles('./pnpm-lock.yaml') != ''
      # The gates bosun-trusted left (fmt, lint, test), in order; the first failure stops the job.
      - if: needs.bosun-trusted.outputs.pr_gates != ''
        name: bosun gates
        env:
          GATES: ${{ needs.bosun-trusted.outputs.pr_gates }}
          BOSUN_SHA256: ${{ needs.bosun-trusted.outputs.sha256 }}
          EVENT: ${{ github.event_name }}
        run: |
          bosun="$RUNNER_TEMP/bin/bosun"
          if [ "$EVENT" = "pull_request" ]; then all=""; else all="--all"; fi
          for g in $GATES; do
            echo "::group::bosun gate $g"
            echo "$BOSUN_SHA256  $bosun" | sha256sum -c --quiet || { echo "::error::$bosun changed"; exit 1; }
            "$bosun" gate "$g" $all || { echo "::error::gate $g failed; later gates did not run"; exit 1; }
            echo "::endgroup::"
          done
